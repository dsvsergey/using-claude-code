name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "index.ru.html"
      - "styles.css"
      - "script.js"
      - "lang.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html index.ru.html styles.css script.js lang.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
